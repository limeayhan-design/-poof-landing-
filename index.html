<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2E7BD6" />

  <title>Poof — Send Anywhere</title>
  <meta name="description" content="Premium free for life. First 500 members only." />

  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <meta property="og:title" content="Poof — Send Anywhere" />
  <meta property="og:description" content="Premium free for life. First 500 members only." />
  <meta property="og:image" content="assets/icon-1024.png" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Poof — Send Anywhere" />
  <meta name="twitter:description" content="Premium free for life. First 500 members only." />
  <meta name="twitter:image" content="assets/icon-1024.png" />

  <link rel="preconnect" href="https://tally.so" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="grain"></div>
  </div>

  <main class="stage">
    <div class="badge">
      <span class="badge-dot"></span>
      Early access · Limited to 500
    </div>

    <div class="icon-wrap">
      <div class="icon-glow" aria-hidden="true"></div>
      <img
        src="assets/icon-1024.png"
        alt="Poof"
        class="icon"
        width="200"
        height="200"
      />
    </div>

    <h1 class="title">
      Send <span class="shine">Anywhere.</span>
    </h1>

    <section class="form-wrap" aria-label="Claim your spot">
      <iframe
        data-tally-src="https://tally.so/embed/obW8pN?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="220"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Claim your Poof spot"
      ></iframe>
    </section>

    <p class="counter">
      <span class="counter-dot"></span>
      Premium free forever · No credit card
    </p>

    <footer class="foot">
      Poof · Crafted with care
    </footer>
  </main>

  <script src="https://tally.so/widgets/embed.js" async></script>
</body>
</html>
